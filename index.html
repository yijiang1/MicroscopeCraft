<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MicroscopeCraft</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; font: 14px system-ui, sans-serif; background: #111; color: #eee; }
      #world, #scope { position: fixed; inset: 0; }
      #scope { display: none; z-index: 10; right: var(--panel-w, 0px); }
      kbd { display: inline-block; min-width: 1.1em; margin: 0 1px; padding: 0 5px; border: 1px solid color-mix(in srgb, currentColor 50%, transparent); border-bottom-width: 3px; border-radius: 5px; background: color-mix(in srgb, currentColor 14%, transparent); color: inherit; font: 600 0.85em/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; text-align: center; text-shadow: none; vertical-align: 1px; }
      #ui { position: fixed; top: 0; right: 0; bottom: 0; width: min(260px, 85vw); z-index: 15; overflow: auto; }
    </style>
  </head>
  <body>
    <div id="world"></div>
    <div id="ui"></div>
    <div id="scope"></div>
    <div id="workbench"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
